[package]
name = "mcp_a2a_bridge_policy"
version = "1.3.2"
rust-version = "1.88.0"
edition = "2021"
description = "Exposes an A2A agent as an MCP tool by transcoding MCP tools/call to A2A SendMessage and back."

[package.metadata.anypoint]
group_id = "00000000-0000-4000-8000-000000000000"
definition_asset_id = "mcp-a2a-bridge-policy"
implementation_asset_id = "mcp-atoa-bridge-policy-flex"

[dependencies]
# enable_stop_iteration: the request filter classifies the body before it touches any header (issue #4).
pdk = { version = "1.8.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10"
# WASI random_get on the gateway; used for unpredictable MCP session ids (issue #12).
getrandom = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"

[dev-dependencies]
pdk-unit = { version = "=1.8.0", features = ["enable_stop_iteration"] }
pdk-test = { version = "=1.8.0" }
httpmock = "0.6"
reqwest = { version = "0.11", features = ["json"] }
